<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BRB – Goddess Kemi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04000a; }

  /* ── PHOTO ── */
  .bg {
    position: fixed; inset: 0;
  }
  .bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center center;
    filter: saturate(0.85) brightness(0.5) contrast(1.05);
    animation: slowzoom 20s ease-in-out infinite alternate;
  }
  @keyframes slowzoom {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
  }

  /* ── OVERLAYS ── */
  .vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, #04000acc 100%);
  }
  .grad-bottom {
    position: fixed; bottom: 0; left: 0; right: 0; height: 40%; z-index: 3; pointer-events: none;
    background: linear-gradient(to bottom, transparent, #04000a);
  }
  .grad-top {
    position: fixed; top: 0; left: 0; right: 0; height: 25%; z-index: 3; pointer-events: none;
    background: linear-gradient(to top, transparent, #04000a88);
  }

  /* ── CORNER ORNAMENTS ── */
  .corner {
    position: fixed; width: 70px; height: 70px; z-index: 10; opacity: 0.5;
    opacity: 0; animation: fadeIn 1.5s ease 0.5s forwards;
  }
  .corner svg { width: 100%; height: 100%; }
  .tl { top: 28px; left: 28px; }
  .tr { top: 28px; right: 28px; transform: scaleX(-1); }
  .bl { bottom: 28px; left: 28px; transform: scaleY(-1); }
  .br { bottom: 28px; right: 28px; transform: scale(-1,-1); }

  /* ── CONTENT ── */
  .content {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0; text-align: center;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(10px, 1.3vw, 14px);
    letter-spacing: 0.45em; text-transform: uppercase;
    color: #c9a96e; font-weight: 300;
    margin-bottom: 18px;
    opacity: 0; animation: fadeUp 1.2s ease 0.6s forwards;
  }

  .brb-text {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(40px, 8vw, 96px);
    font-weight: 700; letter-spacing: 0.08em;
    color: #f5ece0;
    text-shadow: 0 0 80px #c9a96e33, 0 2px 6px #00000088;
    line-height: 1;
    opacity: 0; animation: fadeUp 1.2s ease 0.9s forwards;
  }

  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 22px 0 20px;
    opacity: 0; animation: fadeUp 1.2s ease 1.1s forwards;
  }
  .line { width: 90px; height: 1px; background: linear-gradient(to right, transparent, #c9a96e, transparent); }
  .diamond { width: 5px; height: 5px; background: #c9a96e; transform: rotate(45deg); }

  .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(13px, 1.8vw, 20px);
    letter-spacing: 0.15em; color: #9a7a52;
    opacity: 0; animation: fadeUp 1.2s ease 1.3s forwards;
  }

  /* ── BREATHING DOT ── */
  .dots {
    display: flex; gap: 8px; margin-top: 32px;
    opacity: 0; animation: fadeUp 1.2s ease 1.5s forwards;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #c9a96e;
    animation: breathe 2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.3s; }
  .dot:nth-child(3) { animation-delay: 0.6s; }

  /* ── SOCIALS ── */
  .social {
    position: fixed; bottom: 28px; left: 0; right: 0;
    z-index: 10; display: flex; gap: clamp(16px, 3.5vw, 48px);
    justify-content: center; align-items: center;
    opacity: 0; animation: fadeIn 1.5s ease 1.8s forwards;
  }
  .social-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .social-platform {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(8px, 1vw, 10px); letter-spacing: 0.3em;
    text-transform: uppercase; color: #6b5038;
  }
  .social-handle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(10px, 1.3vw, 14px); letter-spacing: 0.1em; color: #c9a96e;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 0.5; }
  }
  .corner { animation: fadeIn 1.5s ease 0.5s forwards; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.5); opacity: 1; }
  }
</style>
</head>
